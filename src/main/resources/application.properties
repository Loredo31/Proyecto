spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/control_gastos
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.query.timeout=600000

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=18800
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1


spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
gestopago.auth.refresh-rate-ms=3600000

# Integración de catálogo de productos (servicio externo)
catalog.external.base-url=${CATALOG_EXTERNAL_BASE_URL:https://gestopago.portalventas.net}
# El token vive SOLO en propiedades, nunca en el código fuente.
# Se puede sobreescribir por variable de entorno: CATALOG_EXTERNAL_TOKEN
catalog.external.token=${CATALOG_EXTERNAL_TOKEN:token-de-ejemplo-cambiar}
catalog.external.cron=0 0 6 * * *
catalog.external.retry.max-attempts=3
catalog.external.retry.delay-ms=2000

# Timeouts del cliente Feign
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.client.config.default.logger-level=basic

# MongoDB: caché exclusiva del catálogo de productos
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/product_catalog_cache}
spring.data.mongodb.auto-index-creation=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


logging.level.com.proyecto.servicios=INFO
logging.level.com.proyecto.servicios.service.impl=INFO