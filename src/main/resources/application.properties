spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/control_gastos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.query.timeout=600000

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=18800
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1


spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
# Secretos: solo por variable de entorno, sin valor por defecto en el repositorio
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD:}
gestopago.auth.token-ttl=PT24H
gestopago.auth.refresh-rate-ms=82800000

# sendTx.do / confirmTx.do (pago de servicios, recargas y gift cards)
gestopago.tx.url=${GESTOPAGO_TX_URL:https://gestopago.portalventas.net}
gestopago.tx.path=/sistema/service/sendTx.do
gestopago.tx.confirm-path=/sistema/service/confirmTx.do
gestopago.tx.api-key=${GESTOPAGO_API_KEY:}
gestopago.tx.unidad=${GESTOPAGO_UNIDAD:083}
gestopago.tx.codigo-exito=01
gestopago.tx.codigos-indeterminados=06,82
gestopago.tx.codigos-confirmacion-aplicada=01,06
gestopago.tx.codigos-confirmacion-no-aplicada=70
gestopago.tx.espera-minima-confirmacion=PT90S
gestopago.tx.vigencia-confirmacion=PT24H
gestopago.tx.ventana-duplicados=PT5M
gestopago.tx.max-intentos-pin=3
gestopago.tx.zona-horaria=America/Mexico_City
gestopago.tx.formato-hora-local=yyyyMMddHHmmss
gestopago.tx.validar-catalogo=${GESTOPAGO_TX_VALIDAR_CATALOGO:true}
gestopago.tx.umbral-conciliacion=PT10M
gestopago.tx.conciliacion-intervalo-ms=120000
# AES-256-CBC; clave e IV en Base64 tal como los entrega GestoPago
gestopago.tx.aes.transformation=AES/CBC/PKCS5Padding
gestopago.tx.aes.encoding=BASE64
gestopago.tx.aes.key=${GESTOPAGO_AES_KEY:}
gestopago.tx.aes.iv=${GESTOPAGO_AES_IV:}

# GestoPago abandona la operación a los 62 s (código 82): la lectura debe esperar más que eso
spring.cloud.openfeign.client.config.gestoPagoTx.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoTx.read-timeout=70000

catalog.external.base-url=${CATALOG_EXTERNAL_BASE_URL:https://gestopago.portalventas.net}
catalog.external.token=${CATALOG_EXTERNAL_TOKEN:token-de-ejemplo-cambiar}
catalog.external.cron=0 0 6 * * *
catalog.external.retry.max-attempts=3
catalog.external.retry.delay-ms=2000

feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.client.config.default.logger-level=basic

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/product_catalog_cache}
spring.data.mongodb.auto-index-creation=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mongo.enabled=false
management.health.mail.enabled=false


logging.level.com.proyecto.servicios=INFO
logging.level.com.proyecto.servicios.service.impl=INFO
